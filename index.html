<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decision Canvas</title>
    <!-- Miro Web SDK – injected automatically when running inside Miro -->
    <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #1a1a2e;
        background: #ffffff;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 20px 16px;
      }

      .panel__header {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .panel__logo {
        width: 32px;
        height: 32px;
      }

      .panel__title {
        font-size: 18px;
        font-weight: 700;
        margin: 0;
      }

      .panel__description {
        color: #555;
        line-height: 1.5;
        margin: 0;
      }

      .panel__form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .form-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-field label {
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #666;
      }

      .form-field input,
      .form-field select {
        padding: 8px 10px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s;
      }

      .form-field input:focus,
      .form-field select:focus {
        border-color: #4262ff;
      }

      .btn {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s, background 0.15s;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn--primary {
        background: #4262ff;
        color: #ffffff;
      }

      .btn--primary:hover:not(:disabled) {
        background: #3451d1;
      }

      .btn--secondary {
        background: #f0f2ff;
        color: #4262ff;
      }

      .btn--secondary:hover:not(:disabled) {
        background: #dde2ff;
      }

      .status {
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.4;
      }

      .status--hidden {
        display: none;
      }

      .status--success {
        background: #e6f4ea;
        color: #1e7e34;
      }

      .status--error {
        background: #fdecea;
        color: #c0392b;
      }

      .status--loading {
        background: #f0f2ff;
        color: #4262ff;
      }

      .divider {
        border: none;
        border-top: 1px solid #eee;
        margin: 0;
      }

      .template-preview {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px;
        background: #fafafa;
      }

      .template-preview__title {
        font-weight: 600;
        margin: 0 0 8px;
        font-size: 13px;
      }

      .template-preview__sections {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .template-preview__section {
        background: #fff;
        border: 1px solid #d8d8d8;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 11px;
        color: #444;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="panel__header">
        <img
          class="panel__logo"
          src="/icon.svg"
          alt="Decision Canvas logo"
        />
        <h1 class="panel__title">Decision Canvas</h1>
      </div>

      <p class="panel__description">
        Create a structured Decision Canvas on your board to capture options,
        pros &amp; cons, the final decision, and rationale.
      </p>

      <hr class="divider" />

      <!-- Template preview -->
      <div class="template-preview">
        <p class="template-preview__title">Canvas sections</p>
        <div class="template-preview__sections">
          <div class="template-preview__section">🎯 Problem Statement</div>
          <div class="template-preview__section">💡 Options</div>
          <div class="template-preview__section">⚖️ Pros &amp; Cons</div>
          <div class="template-preview__section">✅ Decision</div>
          <div class="template-preview__section">📝 Rationale</div>
          <div class="template-preview__section">🚀 Next Steps</div>
        </div>
      </div>

      <hr class="divider" />

      <!-- Configuration form -->
      <form class="panel__form" id="canvas-form">
        <div class="form-field">
          <label for="canvas-title">Canvas title</label>
          <input
            id="canvas-title"
            type="text"
            placeholder="e.g. Choose cloud provider"
            maxlength="120"
          />
        </div>

        <div class="form-field">
          <label for="color-scheme">Colour scheme</label>
          <select id="color-scheme">
            <option value="blue">Blue (default)</option>
            <option value="green">Green</option>
            <option value="purple">Purple</option>
            <option value="orange">Orange</option>
          </select>
        </div>
      </form>

      <!-- Status message -->
      <div class="status status--hidden" id="status-msg" role="alert"></div>

      <!-- Actions -->
      <button class="btn btn--primary" id="create-btn" type="button">
        Create Decision Canvas
      </button>
      <button class="btn btn--secondary" id="zoom-btn" type="button" style="display:none">
        Zoom to canvas
      </button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
